services:
  user-mgmt:
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=gakuren-network"
      - "traefik.http.routers.user-mgmt.rule=PathPrefix(`/v1/school`)"
      - "traefik.http.routers.user-mgmt.entrypoints=web"
      - "traefik.http.services.user-mgmt.loadbalancer.server.port=3000"
    expose:
      - "3000"
    environment:
      PORT: ${PORT}
      API_VERSION: ${API_VERSION}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_KEY_ID: ${JWT_KEY_ID}
      ACCESS_TOKEN_DURATION: ${ACCESS_TOKEN_DURATION}
      REFRESH_TOKEN_DURATION: ${REFRESH_TOKEN_DURATION}
      JWT_REFRESH_SECURE_KEY: ${JWT_REFRESH_SECURE_KEY}
      RSA_PUBLIC_KEY: ${RSA_PUBLIC_KEY}
      RSA_PRIVATE_KEY: ${RSA_PRIVATE_KEY}
      RSA_PASSPHARSE: ${RSA_PASSPHARSE}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_URL: ${DATABASE_URL}
    networks:
      gakuren-network:
        aliases:
          - user-mgmt

networks:
  gakuren-network:
    external: true